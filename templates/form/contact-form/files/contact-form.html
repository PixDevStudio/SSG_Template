<section class="contact-form" aria-labelledby="contact-form-title">
  <div class="contact-form__intro">
    <p>{{ contact_form.eyebrow }}</p>
    <h2 id="contact-form-title">{{ contact_form.title }}</h2>
    <p>{{ contact_form.description }}</p>
  </div>
  <form action="{{ contact_form.action }}" method="post">
    <label for="contact-name">{{ contact_form.name_label }}</label>
    <input
      id="contact-name"
      name="name"
      type="text"
      autocomplete="name"
      required
    />

    <label for="contact-email">{{ contact_form.email_label }}</label>
    <input
      id="contact-email"
      name="email"
      type="email"
      autocomplete="email"
      required
    />

    <label for="contact-message">{{ contact_form.message_label }}</label>
    <textarea
      id="contact-message"
      name="message"
      rows="6"
      minlength="20"
      required
    ></textarea>

    <button type="submit">{{ contact_form.submit_label }}</button>
  </form>
</section>
