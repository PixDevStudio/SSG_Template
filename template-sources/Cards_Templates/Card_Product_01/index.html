<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cartes produit</title>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div><p>Sélection saisonnière</p><h1>Objets pour le quotidien</h1></div>
            <a href="/boutique">Voir la collection <span aria-hidden="true">→</span></a>
        </header>

        <section class="product-grid" aria-label="Produits en vedette">
            <article class="product-card">
                <a class="product-card__image" href="#lampe"><img src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=900&q=80" alt="Lampe de table en métal blanc sur une table en bois"><span>Nouveau</span></a>
                <div class="product-card__body"><div><p>Éclairage</p><h2><a href="#lampe">Lampe Atelier</a></h2></div><strong>189 $</strong></div>
                <button type="button">Ajouter au panier <span aria-hidden="true">+</span></button>
            </article>

            <article class="product-card">
                <a class="product-card__image" href="#chaise"><img src="https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?auto=format&fit=crop&w=900&q=80" alt="Chaise moderne en bois clair"><span>Favori</span></a>
                <div class="product-card__body"><div><p>Mobilier</p><h2><a href="#chaise">Chaise Ligne</a></h2></div><strong>320 $</strong></div>
                <button type="button">Ajouter au panier <span aria-hidden="true">+</span></button>
            </article>

            <article class="product-card">
                <a class="product-card__image" href="#vase"><img src="https://images.unsplash.com/photo-1610701596007-11502861dcfa?auto=format&fit=crop&w=900&q=80" alt="Vase artisanal beige en céramique"><span>Artisanal</span></a>
                <div class="product-card__body"><div><p>Céramique</p><h2><a href="#vase">Vase Sillon</a></h2></div><strong>94 $</strong></div>
                <button type="button">Ajouter au panier <span aria-hidden="true">+</span></button>
            </article>
        </section>
    </main>
</body>
</html>
