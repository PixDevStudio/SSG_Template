<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Template d’inscription</title>
</head>
<body>
    <main class="signup-page">
        <a class="brand" href="/" aria-label="Collectif, accueil">COLLECTIF<span>+</span></a>

        <section class="signup" aria-labelledby="signup-title">
            <header class="signup__header">
                <p>Créer votre espace</p>
                <h1 id="signup-title">Commençons par faire connaissance.</h1>
                <span>Déjà membre? <a href="/connexion">Se connecter</a></span>
            </header>

            <form class="signup-form" action="/inscription" method="post">
                <div class="field">
                    <label for="first-name">Prénom</label>
                    <input id="first-name" name="first-name" type="text" autocomplete="given-name" required>
                </div>

                <div class="field">
                    <label for="last-name">Nom</label>
                    <input id="last-name" name="last-name" type="text" autocomplete="family-name" required>
                </div>

                <div class="field field--full">
                    <label for="email">Adresse courriel</label>
                    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
                </div>

                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required>
                    <small id="password-hint">Au moins 8 caractères.</small>
                </div>

                <div class="field">
                    <label for="password-confirmation">Confirmer le mot de passe</label>
                    <input id="password-confirmation" name="password-confirmation" type="password" autocomplete="new-password" minlength="8" required>
                </div>

                <label class="agreement field--full">
                    <input name="terms" type="checkbox" required>
                    <span>J’accepte les <a href="/conditions">conditions d’utilisation</a> et la <a href="/confidentialite">politique de confidentialité</a>.</span>
                </label>

                <button class="button field--full" type="submit">Créer mon compte <span aria-hidden="true">→</span></button>
            </form>
        </section>
    </main>
</body>
</html>
